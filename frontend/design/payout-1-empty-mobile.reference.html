<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buysafe — payout account (mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',sans-serif;color:#121410;background:#F3EDE0;-webkit-font-smoothing:antialiased}
a{color:#0D3B2A}
.num{font-variant-numeric:tabular-nums lining-nums}
.mono{font-family:'IBM Plex Mono',monospace}
input{font-family:'IBM Plex Mono',monospace;font-size:19px;color:#121410;outline:none}
input::placeholder{color:#8C8E85}
button{font-family:'Bricolage Grotesque',sans-serif;cursor:pointer}
</style>
<div style="max-width: 390px; min-height: 844px; margin: 0 auto; display: flex; flex-direction: column; background: #F3EDE0; overflow: hidden">

<header style="flex-shrink: 0; background: #0D3B2A; color: #F3EDE0; padding: 8px 20px 26px; display: flex; flex-direction: column; gap: 14px">
<a href="/profile" style="color: #F3EDE0; text-decoration: none; font-size: 15px; font-weight: 600; min-height: 44px; display: flex; align-items: center; margin-left: -8px; padding-left: 8px">←  Profile</a>
<span class="mono" style="font-size: 11px; letter-spacing: .12em; color: #F5B82E">PAYOUT ACCOUNT</span>
<h1 style="margin: 0; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">Where should we <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #F5B82E">pay you?</span></h1>
</header>

<div style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Bank
<span style="height: 54px; box-sizing: border-box; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.18); border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 17px; font-weight: 400; color: #8C8E85">Choose your bank<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#121410" stroke-width="1.8" aria-hidden="true"><path d="M3 5l4 4 4-4"></path></svg></span>
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Account number
<input type="text" inputmode="numeric" maxlength="10" placeholder="10 digits" value="" class="num" style="height: 56px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.18); border-radius: 12px; letter-spacing: .08em; box-shadow: none">
</label>

<span style="font-size: 13px; line-height: 1.5; color: #5B5E55">The account name must match your buysafe name, <strong style="color: #121410">Tolu Adeyemi</strong>.</span>





<button type="button" aria-disabled="true" style="margin-top: auto; height: 58px; border: 0; border-radius: 14px; background: #8C8E85; color: #F3EDE0; font-size: 17px; font-weight: 700">Save payout account</button>

</div>

</div>
</body>
</html>
