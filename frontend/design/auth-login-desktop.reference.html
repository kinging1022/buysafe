<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buysafe — log in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',sans-serif;color:#121410;background:#F3EDE0;-webkit-font-smoothing:antialiased}
a{color:#0D3B2A}a:hover{color:#1E6B45}
.guilloche{background:repeating-radial-gradient(circle at 50% 50%, rgba(243,237,224,0) 0 9px, rgba(243,237,224,.10) 9px 10px)}
.perf{position:relative}
.perf::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:20px;background:radial-gradient(circle at 10px 0, transparent 9px, #F3EDE0 10px) 0 0/20px 20px repeat-x}
.dash{border-top:1.5px dashed rgba(18,20,16,.28)}
input{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;color:#121410;outline:none}
input::placeholder{color:#8C8E85}
</style>
<div style="max-width: 1440px; min-height: 900px; margin: 0 auto; display: grid; grid-template-columns: 600px 1fr; background: #F3EDE0; overflow: hidden">

<aside style="background: #0D3B2A; color: #F3EDE0; padding: 48px 64px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
<div class="guilloche" style="position: absolute; width: 760px; height: 760px; border-radius: 50%; left: -180px; bottom: -300px"></div>
<a href="/" style="position: relative; text-decoration: none; color: #F3EDE0; font-size: 30px; font-weight: 800; letter-spacing: -0.04em">buysafe<span style="color: #F5B82E">.</span></a>
<div style="position: relative; display: flex; flex-direction: column; gap: 40px">
<h1 style="margin: 0; font-size: 72px; line-height: .96; font-weight: 800; letter-spacing: -0.045em">Welcome back. Your money is <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; color: #F5B82E">where you left it.</span></h1>
<div class="perf" style="width: 400px; background: #F3EDE0; color: #121410; padding: 24px 26px 30px; transform: rotate(-2deg); box-shadow: 0 24px 50px rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 14px; position: relative">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #5B5E55"><span>ESCROW RECEIPT</span><span>No. BS-004213</span></div>
<div class="dash"></div>
<div style="font-size: 16px; font-weight: 700">PlayStation 5 Slim</div>
<div style="font-size: 44px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">₦280,000</div>
<div style="position: absolute; right: 18px; top: 64px; transform: rotate(9deg); border: 3px solid #A86A0C; outline: 1.5px solid #A86A0C; outline-offset: 3px; color: #A86A0C; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px; letter-spacing: .14em; padding: 5px 10px; border-radius: 4px; opacity: .92">HELD SAFE</div>
</div>
</div>
<div style="position: relative; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .04em; color: #A9BBA9">✓ Phone-verified users only · Payments by [PAYMENT PARTNER]</div>
</aside>

<main style="display: flex; flex-direction: column; padding: 40px 64px">
<div style="display: flex; justify-content: flex-end; gap: 8px; font-size: 15px; color: #3E4139"><span>New to buysafe?</span><a href="/signup" style="font-weight: 700">Create an account</a></div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<form style="width: 440px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .14em; color: #5B5E55">LOG IN</div>
<h2 style="margin: 0; font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">Good to see you.</h2>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Phone number
<div style="display: flex; height: 54px; background: #FFFFFF; border: 2px solid #121410; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 4px rgba(245,184,46,.45)">
<span style="display: flex; align-items: center; padding: 0 16px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; background: #EFE9DC; border-right: 1.5px solid rgba(18,20,16,.14)">+234</span>
<input type="tel" value="803 123 4567" style="flex-grow: 1; border: 0; padding: 0 16px; background: transparent; font-variant-numeric: tabular-nums">
</div>
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">
<span style="display: flex; justify-content: space-between"><span>Password</span><a href="#" style="font-weight: 600; font-size: 14px">Forgot password?</a></span>
<div style="display: flex; height: 54px; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.22); border-radius: 12px; overflow: hidden; align-items: center">
<input type="password" placeholder="Your password" style="flex-grow: 1; border: 0; padding: 0 16px; background: transparent">
<button type="button" style="height: 100%; padding: 0 16px; border: 0; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #3E4139; cursor: pointer">SHOW</button>
</div>
</label>
<a href="/" style="margin-top: 6px; height: 58px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #0D3B2A; color: #F3EDE0; border-radius: 12px; font-size: 18px; font-weight: 700">Log in  →</a>
<div style="display: flex; align-items: center; gap: 14px; color: #8C8E85; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .1em"><span style="flex-grow: 1; border-top: 1px solid rgba(18,20,16,.15)"></span>OR<span style="flex-grow: 1; border-top: 1px solid rgba(18,20,16,.15)"></span></div>
<a href="/signup" style="height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #121410; border: 1.5px solid #121410; border-radius: 12px; font-size: 17px; font-weight: 600">Create a new account</a>
</form>
</div>
</main>

</div>
</body>
</html>
