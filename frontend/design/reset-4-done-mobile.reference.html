<!doctype html>
<html lang="en">
<head>

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',sans-serif;color:#121410;background:#F3EDE0;-webkit-font-smoothing:antialiased}

.otp{font-family:'IBM Plex Mono',monospace}
button{font-family:'Bricolage Grotesque',sans-serif;cursor:pointer}
</style>
<div style="max-width: 390px; min-height: 844px; margin: 0 auto; display: flex; flex-direction: column; background: #F3EDE0; overflow: hidden">

<header style="background: #0D3B2A; color: #F3EDE0; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 24px; position: relative; overflow: hidden">
<div class="guilloche" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; right: -200px; top: -160px"></div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: center">
<button type="button" style="background: transparent; border: 0; padding: 0; color: #F3EDE0; font-size: 15px; font-weight: 600; min-height: 44px">←  Back</button>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #F5B82E">DONE</span>
</div>
<h1 style="position: relative; margin: 0; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">Forgot it? Your money <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #F5B82E">didn’t go anywhere.</span></h1>
<div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<span style="height: 4px; border-radius: 2px; background: #B6E36B"></span><span style="height: 4px; border-radius: 2px; background: #B6E36B"></span><span style="height: 4px; border-radius: 2px; background: #B6E36B"></span>
</div>
</header>

<div style="flex-grow: 1; padding: 32px 20px 32px; display: flex; flex-direction: column">








<div style="display: flex; flex-direction: column; gap: 22px">
<span style="align-self: flex-start; transform: rotate(-6deg); border: 2.5px solid #1E6B45; outline: 1.5px solid #1E6B45; outline-offset: 3px; color: #1E6B45; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; letter-spacing: .14em; padding: 5px 10px; border-radius: 4px">RESET</span>
<h2 style="margin: 0; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.04em">Password changed. <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #1E6B45">You’re back in.</span></h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3E4139">Log in with your new password. Other devices have been signed out.</p>
<a href="/login" style="height: 58px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #0D3B2A; color: #F3EDE0; border-radius: 12px; font-size: 18px; font-weight: 700">Log in  →</a>
<button type="button" style="background: transparent; border: 0; font-size: 14px; color: #5B5E55; text-decoration: underline; min-height: 44px">Replay this flow</button>
</div>


<p style="margin: auto 0 0; padding-top: 24px; font-size: 15px; color: #3E4139; text-align: center">Remembered it? <a href="/login" style="font-weight: 700">Log in</a></p>
</div>

</div>
