<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buysafe — record live video (mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',sans-serif;color:#F3EDE0;background:#121410;-webkit-font-smoothing:antialiased}
.vid{background:repeating-linear-gradient(135deg, rgba(243,237,224,.05) 0 10px, rgba(243,237,224,0) 10px 20px)}
.num{font-variant-numeric:tabular-nums lining-nums}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:'Bricolage Grotesque',sans-serif;cursor:pointer}
</style>
<div class="vid" style="max-width: 390px; min-height: 844px; margin: 0 auto; position: relative; overflow: hidden; background-color: #121410; color: #F3EDE0; display: flex; flex-direction: column">

<div style="flex-shrink: 0; padding: 12px 12px 8px; display: flex; justify-content: space-between; align-items: center">
<a href="/deals/317" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(243,237,224,.14); color: #F3EDE0; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px">×</a>
<span class="mono num" style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 999px"><span style="width: 9px; height: 9px; border-radius: 50%; background: #E5484D"></span>REC 0:12 / 1:00</span>
<span class="mono" style="font-size: 11px; font-weight: 600; letter-spacing: .1em; padding: 8px 10px; border-radius: 999px; background: #F5B82E; color: #121410">VIDEO 1 OF 3</span>
</div>



<div style="flex-grow: 1; margin: 12px 16px 0; position: relative; display: flex; align-items: center; justify-content: center">
<span style="position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-left: 3px solid #F5B82E; border-top: 3px solid #F5B82E; border-radius: 6px 0 0 0"></span>
<span style="position: absolute; right: 0; top: 0; width: 34px; height: 34px; border-right: 3px solid #F5B82E; border-top: 3px solid #F5B82E; border-radius: 0 6px 0 0"></span>
<span style="position: absolute; left: 0; bottom: 0; width: 34px; height: 34px; border-left: 3px solid #F5B82E; border-bottom: 3px solid #F5B82E; border-radius: 0 0 0 6px"></span>
<span style="position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; border-right: 3px solid #F5B82E; border-bottom: 3px solid #F5B82E; border-radius: 0 0 6px 0"></span>

<span class="mono" style="font-size: 11px; letter-spacing: .12em; color: rgba(243,237,224,.45)">LIVE CAMERA · BACK LENS</span>
<div role="alert" style="position: absolute; left: 20px; right: 20px; bottom: 20px; background: #F3EDE0; color: #121410; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">Too short. Keep going.</span><span style="font-size: 13px; color: #3E4139">Videos need at least 20 seconds so Ada can see everything.</span></div>
</div>


<div style="flex-shrink: 0; margin: 12px 16px 0; background: rgba(0,0,0,.55); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; font-size: 13px">
<span style="color: #B6E36B">✓ Front</span><span style="color: rgba(243,237,224,.75)">○ Back</span><span style="color: rgba(243,237,224,.75)">○ All sides</span><span style="color: rgba(243,237,224,.75)">○ Switched on</span>
</div>



<div style="flex-shrink: 0; padding: 20px 0 10px; display: flex; justify-content: center">
<button type="button" aria-label="Stop recording" style="width: 80px; height: 80px; border-radius: 50%; border: 4px solid #F3EDE0; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 30px; height: 30px; border-radius: 6px; background: #E5484D"></span></button>
</div>
<span style="flex-shrink: 0; padding: 0 28px 24px; text-align: center; font-size: 12px; line-height: 1.5; color: rgba(243,237,224,.7)">20–60 seconds. Camera only: videos can’t be picked from your gallery.</span>




</div>
</body>
</html>
