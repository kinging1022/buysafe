<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buysafe — create account (mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',sans-serif;color:#121410;background:#F3EDE0;-webkit-font-smoothing:antialiased}
a{color:#0D3B2A}a:hover{color:#1E6B45}
.guilloche{background:repeating-radial-gradient(circle at 50% 50%, rgba(243,237,224,0) 0 8px, rgba(243,237,224,.10) 8px 9px)}
input{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;color:#121410;outline:none}
input::placeholder{color:#8C8E85}
</style>
<div style="max-width: 390px; min-height: 1120px; margin: 0 auto; display: flex; flex-direction: column; background: #F3EDE0; overflow: hidden">

<header style="background: #0D3B2A; color: #F3EDE0; padding: 20px 20px 36px; display: flex; flex-direction: column; gap: 28px; position: relative; overflow: hidden">
<div class="guilloche" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; right: -200px; top: -160px"></div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: center">
<a href="/" style="text-decoration: none; color: #F3EDE0; font-size: 24px; font-weight: 800; letter-spacing: -0.04em">buysafe<span style="color: #F5B82E">.</span></a>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #F5B82E">STEP 1 OF 2</span>
</div>
<h1 style="position: relative; margin: 0; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">Two minutes. Then <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #F5B82E">nobody goes first.</span></h1>
<div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<span style="height: 4px; border-radius: 2px; background: #F5B82E"></span>
<span style="height: 4px; border-radius: 2px; background: rgba(243,237,224,.25)"></span>
</div>
</header>

<form style="flex-grow: 1; padding: 32px 20px 40px; display: flex; flex-direction: column; gap: 20px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">First name
<input type="text" value="Chiamaka" style="height: 54px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 2px solid #121410; border-radius: 12px; box-shadow: 0 0 0 4px rgba(245,184,46,.45)">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Last name
<input type="text" placeholder="As on your bank account" style="height: 54px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.22); border-radius: 12px">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Phone number
<div style="display: flex; height: 54px; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.22); border-radius: 12px; overflow: hidden">
<span style="display: flex; align-items: center; padding: 0 14px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; background: #EFE9DC; border-right: 1.5px solid rgba(18,20,16,.14)">+234</span>
<input type="tel" placeholder="803 123 4567" style="flex-grow: 1; min-width: 0; border: 0; padding: 0 14px; background: transparent">
</div>
<span style="font-size: 13px; font-weight: 400; color: #5B5E55">We’ll text a 6-digit code to confirm it’s yours.</span>
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Password
<div style="display: flex; height: 54px; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.22); border-radius: 12px; overflow: hidden; align-items: center">
<input type="password" value="safe2buy1" style="flex-grow: 1; min-width: 0; border: 0; padding: 0 16px; background: transparent; letter-spacing: .1em">
<button type="button" style="height: 100%; padding: 0 16px; border: 0; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #3E4139">SHOW</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">
<span style="color: #1E6B45">✓ 8+ characters</span><span style="color: #1E6B45">✓ A number</span><span style="color: #8C8E85">○ A capital letter</span>
</div>
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Confirm password
<div style="display: flex; height: 54px; background: #FFFFFF; border: 1.5px solid #A3361F; border-radius: 12px; overflow: hidden; align-items: center">
<input type="password" value="safe2buy" style="flex-grow: 1; min-width: 0; border: 0; padding: 0 16px; background: transparent; letter-spacing: .1em">
<button type="button" style="height: 100%; padding: 0 16px; border: 0; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #3E4139">SHOW</button>
</div>
<span style="font-size: 13px; font-weight: 500; color: #A3361F">Passwords don’t match yet.</span>
</label>
<a href="/verify" style="margin-top: 8px; height: 58px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #0D3B2A; color: #F3EDE0; border-radius: 12px; font-size: 18px; font-weight: 700">Continue  →</a>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5B5E55">By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
<p style="margin: 8px 0 0; font-size: 15px; color: #3E4139; text-align: center">Already have an account? <a href="/login" style="font-weight: 700">Log in</a></p>
</form>

</div>
</body>
</html>
