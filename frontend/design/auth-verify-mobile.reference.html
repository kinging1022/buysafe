<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buysafe — verify phone (mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',sans-serif;color:#121410;background:#F3EDE0;-webkit-font-smoothing:antialiased}
a{color:#0D3B2A}a:hover{color:#1E6B45}
.guilloche{background:repeating-radial-gradient(circle at 50% 50%, rgba(243,237,224,0) 0 8px, rgba(243,237,224,.10) 8px 9px)}
input{font-family:'IBM Plex Mono',monospace;color:#121410;outline:none}
</style>
<div style="max-width: 390px; min-height: 844px; margin: 0 auto; display: flex; flex-direction: column; background: #F3EDE0; overflow: hidden">

<header style="background: #0D3B2A; color: #F3EDE0; padding: 20px 20px 36px; display: flex; flex-direction: column; gap: 28px; position: relative; overflow: hidden">
<div class="guilloche" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; right: -200px; top: -160px"></div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: center">
<a href="/signup" style="text-decoration: none; color: #F3EDE0; font-size: 15px; font-weight: 600; min-height: 44px; display: flex; align-items: center">←  Back</a>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; color: #F5B82E">STEP 2 OF 2</span>
</div>
<h1 style="position: relative; margin: 0; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">One code. So everyone is <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #F5B82E">who they say.</span></h1>
<div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<span style="height: 4px; border-radius: 2px; background: #B6E36B"></span>
<span style="height: 4px; border-radius: 2px; background: #F5B82E"></span>
</div>
</header>

<form style="flex-grow: 1; padding: 32px 20px 32px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em">Enter the 6-digit code.</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3E4139">Sent by SMS to <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #121410">+234 803 ••• 4567</span>. <a href="/signup" style="font-weight: 700">Change</a></p>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<input aria-label="Digit 1" inputmode="numeric" maxlength="1" value="4" style="height: 62px; width: 100%; box-sizing: border-box; text-align: center; font-size: 26px; font-weight: 600; background: #FFFFFF; border: 1.5px solid #121410; border-radius: 10px">
<input aria-label="Digit 2" inputmode="numeric" maxlength="1" value="8" style="height: 62px; width: 100%; box-sizing: border-box; text-align: center; font-size: 26px; font-weight: 600; background: #FFFFFF; border: 1.5px solid #121410; border-radius: 10px">
<input aria-label="Digit 3" inputmode="numeric" maxlength="1" value="2" style="height: 62px; width: 100%; box-sizing: border-box; text-align: center; font-size: 26px; font-weight: 600; background: #FFFFFF; border: 1.5px solid #121410; border-radius: 10px">
<input aria-label="Digit 4" inputmode="numeric" maxlength="1" value="" style="height: 62px; width: 100%; box-sizing: border-box; text-align: center; font-size: 26px; font-weight: 600; background: #FFFFFF; border: 2px solid #121410; border-radius: 10px; box-shadow: 0 0 0 4px rgba(245,184,46,.45)">
<input aria-label="Digit 5" inputmode="numeric" maxlength="1" value="" style="height: 62px; width: 100%; box-sizing: border-box; text-align: center; font-size: 26px; font-weight: 600; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.22); border-radius: 10px">
<input aria-label="Digit 6" inputmode="numeric" maxlength="1" value="" style="height: 62px; width: 100%; box-sizing: border-box; text-align: center; font-size: 26px; font-weight: 600; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.22); border-radius: 10px">
</div>
<div style="font-size: 14px; color: #5B5E55">Didn’t get it? Resend in <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #121410">0:42</span></div>
<a href="/login" style="height: 58px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #0D3B2A; color: #F3EDE0; border-radius: 12px; font-size: 18px; font-weight: 700">Verify and create account</a>
<div style="margin-top: auto; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: #E6DDC9; border-radius: 12px; font-size: 14px; line-height: 1.5; color: #3E4139">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #A86A0C; padding-top: 3px">NOTE</span>
<span>We’ll never call to ask for this code. Don’t share it with anyone, even a “buyer”.</span>
</div>
</form>

</div>
</body>
</html>
