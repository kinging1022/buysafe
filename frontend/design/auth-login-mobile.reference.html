<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buysafe — log in (mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',sans-serif;color:#121410;background:#F3EDE0;-webkit-font-smoothing:antialiased}
a{color:#0D3B2A}a:hover{color:#1E6B45}
.guilloche{background:repeating-radial-gradient(circle at 50% 50%, rgba(243,237,224,0) 0 8px, rgba(243,237,224,.10) 8px 9px)}
input{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;color:#121410;outline:none}
input::placeholder{color:#8C8E85}
</style>
<div style="max-width: 390px; min-height: 844px; margin: 0 auto; display: flex; flex-direction: column; background: #F3EDE0; overflow: hidden">

<header style="background: #0D3B2A; color: #F3EDE0; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 32px; position: relative; overflow: hidden">
<div class="guilloche" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; right: -200px; top: -160px"></div>
<a href="/" style="position: relative; text-decoration: none; color: #F3EDE0; font-size: 24px; font-weight: 800; letter-spacing: -0.04em">buysafe<span style="color: #F5B82E">.</span></a>
<h1 style="position: relative; margin: 0; font-size: 44px; line-height: .98; font-weight: 800; letter-spacing: -0.045em">Welcome back. Your money is <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #F5B82E">where you left it.</span></h1>
</header>

<form style="flex-grow: 1; padding: 32px 20px 32px; display: flex; flex-direction: column; gap: 20px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Phone number
<div style="display: flex; height: 54px; background: #FFFFFF; border: 2px solid #121410; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 4px rgba(245,184,46,.45)">
<span style="display: flex; align-items: center; padding: 0 14px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; background: #EFE9DC; border-right: 1.5px solid rgba(18,20,16,.14)">+234</span>
<input type="tel" value="803 123 4567" style="flex-grow: 1; min-width: 0; border: 0; padding: 0 14px; background: transparent">
</div>
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">
<span style="display: flex; justify-content: space-between"><span>Password</span><a href="#" style="font-weight: 600">Forgot password?</a></span>
<div style="display: flex; height: 54px; background: #FFFFFF; border: 1.5px solid rgba(18,20,16,.22); border-radius: 12px; overflow: hidden; align-items: center">
<input type="password" placeholder="Your password" style="flex-grow: 1; min-width: 0; border: 0; padding: 0 16px; background: transparent">
<button type="button" style="height: 100%; padding: 0 16px; border: 0; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #3E4139">SHOW</button>
</div>
</label>
<a href="/" style="margin-top: 8px; height: 58px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #0D3B2A; color: #F3EDE0; border-radius: 12px; font-size: 18px; font-weight: 700">Log in  →</a>
<p style="margin: auto 0 0; font-size: 15px; color: #3E4139; text-align: center">New to buysafe? <a href="/signup" style="font-weight: 700">Create an account</a></p>
</form>

</div>
</body>
</html>
