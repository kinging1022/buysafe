<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buysafe — pay into escrow (mobile)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',sans-serif;color:#121410;background:#F3EDE0;-webkit-font-smoothing:antialiased}
a{color:#0D3B2A}
.photo{background:repeating-linear-gradient(135deg, rgba(18,20,16,.035) 0 10px, rgba(18,20,16,0) 10px 20px)}
.dash{border-top:1.5px dashed rgba(18,20,16,.28)}
.num{font-variant-numeric:tabular-nums lining-nums}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:'Bricolage Grotesque',sans-serif;cursor:pointer}
</style>
<div style="max-width: 390px; min-height: 844px; margin: 0 auto; position: relative; overflow: hidden; background: #F3EDE0; display: flex; flex-direction: column">




<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div class="photo" style="height: 300px; background-color: #E4DBC6; flex-shrink: 0"></div>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 8px">
<span class="mono" style="align-self: flex-start; font-size: 10px; font-weight: 600; letter-spacing: .1em; padding: 5px 9px; border-radius: 999px; background: #1E6B45; color: #F3EDE0">LIVE · GOOD CONDITION</span>
<h1 style="margin: 0; font-size: 32px; line-height: 1.02; font-weight: 800; letter-spacing: -0.04em">Samsung fridge, 2 doors</h1>
<span class="num" style="font-size: 40px; font-weight: 800; letter-spacing: -0.045em">₦185,000</span>
</div>

<div style="margin: 0 20px; border: 2px solid #F5B82E; background: rgba(245,184,46,.14); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span class="mono" style="font-size: 10px; font-weight: 600; letter-spacing: .1em; color: #A86A0C">OFFER ACCEPTED · FIRST TO PAY GETS IT</span>
<span class="num" style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em">₦175,000</span>
<span class="num" style="font-size: 13px; line-height: 1.45; color: #3E4139">Price held for you until <strong style="color: #121410">6:40 PM</strong>. Others can still pay full price.</span>
</div>


<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #F3EDE0; border-top: 1px solid rgba(18,20,16,.15); padding: 12px 16px 22px">
<button type="button" class="num" style="width: 100%; height: 56px; border: 0; border-radius: 12px; background: #0D3B2A; color: #F3EDE0; font-size: 17px; font-weight: 700">Pay ₦175,000 into escrow</button>

</div>
</div>


</div>
</body>
</html>
